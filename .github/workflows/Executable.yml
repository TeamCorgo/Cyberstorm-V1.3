name: Build Windows EXE

on:
  workflow_dispatch:
  push:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --name CyberstormPatcher --icon=./exe_patcher/icon.ico ./py_patcher/CyberstormPatcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CyberstormPatcher-Windows
          path: dist/CyberstormPatcher.exe